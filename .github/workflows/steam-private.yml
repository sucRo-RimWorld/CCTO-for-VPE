name: CCTO for VPE existing Workshop update (preserve visibility)
on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      mode:
        description: 'preflight / runner_check / publisher_state_check / tag_runner_check / update_existing / sync_tags_existing'
        required: true
        type: choice
        default: preflight
        options:
          - preflight
          - runner_check
          - publisher_state_check
          - tag_runner_check
          - update_existing
          - sync_tags_existing
      exact_main_sha:
        description: 'Exactly 40 hex chars of the approved current main HEAD'
        type: string
        required: true
      create_new_item:
        description: 'Creation disabled for the existing item; must remain false'
        type: boolean
        default: false
        required: true
      confirmation:
        description: 'UPDATE_EXISTING_ONLY for update_existing; TAGS_EXISTING_ONLY for sync_tags_existing'
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: ccto-vpe-steam-existing-publishing
  cancel-in-progress: false
jobs:
  request_gate:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'issues' && github.event.issue.user.login == 'sucRo0629' && github.event.issue.title == '[publish:ccto-vpe-update]') }}
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.request.outputs.mode }}
      exact_sha: ${{ steps.request.outputs.exact_sha }}
      confirmation: ${{ steps.request.outputs.confirmation }}
      create_new: ${{ steps.request.outputs.create_new }}
    steps:
      - name: Authenticate release request, pin main and prohibit creation
        id: request
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.event.issue.user.login }}
          TITLE: ${{ github.event.issue.title }}
          BODY: ${{ github.event.issue.body }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_SHA: ${{ inputs.exact_main_sha }}
          INPUT_CONFIRM: ${{ inputs.confirmation }}
          INPUT_CREATE: ${{ inputs.create_new_item }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == 'sucRo-RimWorld/CCTO-for-VPE' && "$GITHUB_REF" == 'refs/heads/main' ]] || exit 2
          if [[ "$EVENT" == issues ]]; then
            [[ "$ACTOR" == 'sucRo0629' && "$TITLE" == '[publish:ccto-vpe-update]' ]] || exit 2
            [[ "$BODY" =~ ^source_sha=([0-9a-f]{40})$ ]] || exit 2
            sha="${BASH_REMATCH[1]}"
            mode=update_existing
            confirm=UPDATE_EXISTING_ONLY
            create=false
          elif [[ "$EVENT" == workflow_dispatch ]]; then
            sha="$INPUT_SHA"
            mode="$INPUT_MODE"
            confirm="$INPUT_CONFIRM"
            create="$INPUT_CREATE"
          else
            exit 2
          fi
          [[ "$sha" =~ ^[0-9a-f]{40}$ && "$sha" == "$GITHUB_SHA" && "$create" == false ]] || exit 2
          case "$mode" in
            update_existing) [[ "$confirm" == UPDATE_EXISTING_ONLY ]] ;;
            sync_tags_existing) [[ "$confirm" == TAGS_EXISTING_ONLY ]] ;;
            preflight|runner_check|publisher_state_check|tag_runner_check) [[ -z "$confirm" ]] ;;
            *) exit 2 ;;
          esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "exact_sha=$sha" >> "$GITHUB_OUTPUT"
          echo "confirmation=$confirm" >> "$GITHUB_OUTPUT"
          echo "create_new=$create" >> "$GITHUB_OUTPUT"
  preflight:
    needs: request_gate
    if: ${{ needs.request_gate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify manual default-branch authorization (no untrusted refs)
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.request_gate.outputs.exact_sha }}
          REQUESTED_MODE: ${{ needs.request_gate.outputs.mode }}
          CONFIRMATION: ${{ needs.request_gate.outputs.confirmation }}
          CREATE_NEW: ${{ needs.request_gate.outputs.create_new }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == 'sucRo-RimWorld/CCTO-for-VPE' ]] || exit 2
          [[ ( "$GITHUB_EVENT_NAME" == 'workflow_dispatch' || "$GITHUB_EVENT_NAME" == 'issues' ) && "$GITHUB_REF" == 'refs/heads/main' ]] || exit 2
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ && "$EXPECTED_SHA" == "$GITHUB_SHA" ]] || exit 2
          if [[ "$REQUESTED_MODE" == 'update_existing' ]]; then
            [[ "$CREATE_NEW" == 'false' && "$CONFIRMATION" == 'UPDATE_EXISTING_ONLY' ]] || exit 2
            # Creation disabled; the retained public item must not change visibility.
          elif [[ "$REQUESTED_MODE" == 'sync_tags_existing' ]]; then
            [[ "$CREATE_NEW" == 'false' && "$CONFIRMATION" == 'TAGS_EXISTING_ONLY' ]] || exit 2
          elif [[ "$REQUESTED_MODE" == 'preflight' || "$REQUESTED_MODE" == 'runner_check' || "$REQUESTED_MODE" == 'publisher_state_check' || "$REQUESTED_MODE" == 'tag_runner_check' ]]; then
            [[ "$CREATE_NEW" == 'false' && -z "$CONFIRMATION" ]] || exit 2
          else
            exit 2
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Checkout CCTO main for nine counterpart parity checks
        uses: actions/checkout@v4
        with:
          repository: sucRo-RimWorld/RimWorld-Crop-Cold-Tolerance-Overhaul
          ref: main
          path: .ccto-base
          persist-credentials: false
          sparse-checkout: |
            Patches
      - name: Verify exact-source plant contracts, approved preview and uploader safety
        env:
          CCTO_SOURCE_ROOT: .ccto-base
          CCTO_PARITY_REQUIRED: '1'
        run: python -m unittest discover -s Tests -p 'test_*.py' -v
      - name: Build exactly eight subscriber files
        run: |
          python Scripts/build_release.py --output Dist/CCTO-for-VPE-0.1.0.zip
          python Scripts/steamcmd_private.py --zip Dist/CCTO-for-VPE-0.1.0.zip
          python Scripts/steamworks_tags.py
          # Hash entries are relative to Dist; update_existing verifies after cd Dist.
          (cd Dist && sha256sum CCTO-for-VPE-0.1.0.zip > sha256.txt && sha256sum -c sha256.txt)
      - name: Retain candidate for publisher job and auditing
        uses: actions/upload-artifact@v4
        with:
          name: ccto-for-vpe-0.1.0-private-candidate
          path: |
            Dist/CCTO-for-VPE-0.1.0.zip
            Dist/sha256.txt
          if-no-files-found: error
          retention-days: 7
  runner_check:
    needs: [request_gate, preflight]
    if: ${{ needs.request_gate.outputs.mode == 'runner_check' }}
    # Same dedicated host and GitHub environment as update_existing, but no SteamCMD invocation.
    runs-on: [self-hosted, linux, steamcmd-private-publisher]
    environment: steam-workshop-private
    timeout-minutes: 12
    steps:
      - name: Check out approved main on publisher runner
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download preflight candidate on publisher runner
        uses: actions/download-artifact@v4
        with:
          name: ccto-for-vpe-0.1.0-private-candidate
          path: Dist
      - name: Verify downloaded artifact checksum without invoking SteamCMD
        shell: bash
        run: |
          set -euo pipefail
          cd Dist
          sha256sum -c sha256.txt

  publisher_state_check:
    needs: [request_gate, preflight]
    if: ${{ needs.request_gate.outputs.mode == 'publisher_state_check' }}
    # Execute on the actual WSL SteamCMD publisher, never in a hosted/Windows job.
    # Only reads CCTO_STEAM_STATE; cannot mutate the state or contact Steam.
    runs-on: [self-hosted, linux, steamcmd-private-publisher]
    environment: steam-workshop-private
    timeout-minutes: 12
    steps:
      - name: Check out pinned main without persisting checkout credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate private publisher state in read-only mode
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.request_gate.outputs.exact_sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" == "$EXPECTED_SHA" ]] || exit 2
          # CCTO_STEAM_STATE must already exist in the host service environment.
          # Never print its path, full JSON, account, token, or credentials.
          python3 Scripts/steamcmd_private.py --check-host-state

  update_existing:
    needs: [request_gate, preflight]
    if: ${{ needs.request_gate.outputs.mode == 'update_existing' }}
    # Dedicated, isolated publisher host. Do NOT attach this label to general PR/test runners.
    runs-on: [self-hosted, linux, steamcmd-private-publisher]
    environment: steam-workshop-private
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ccto-for-vpe-0.1.0-private-candidate
          path: Dist
      - name: Verify candidate artifact digest and reviewed source before invoking SteamCMD
        shell: bash
        run: |
          set -euo pipefail
          cd Dist
          sha256sum -c sha256.txt
      - name: SteamCMD update existing item without changing visibility
        shell: bash
        env:
          CREATE_NEW: ${{ needs.request_gate.outputs.create_new }}
          CONFIRMATION: ${{ needs.request_gate.outputs.confirmation }}
        run: |
          set -euo pipefail
          # CCTO_STEAMCMD_BIN, CCTO_STEAM_ACCOUNT and CCTO_STEAM_STATE
          # must already be configured LOCALLY on the isolated runner.
          [[ "$CREATE_NEW" == 'false' ]] || exit 2
          python3 Scripts/steamcmd_private.py \
            --zip Dist/CCTO-for-VPE-0.1.0.zip \
            --execute --confirm "$CONFIRMATION"

  tag_runner_check:
    needs: [request_gate, preflight]
    if: ${{ needs.request_gate.outputs.mode == 'tag_runner_check' }}
    runs-on: [self-hosted, windows, steamworks-tag-publisher]
    environment: steam-workshop-private
    timeout-minutes: 10
    steps:
      - name: Check out approved main
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify source revision and Steamworks desktop login without submitting tags
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ needs.request_gate.outputs.exact_sha }}
        run: |
          if ($env:GITHUB_SHA -cne $env:EXPECTED_SHA) { throw 'Source SHA changed' }
          python Scripts/steamworks_tags.py --probe
          if ($LASTEXITCODE -ne 0) { throw 'Steamworks probe failed' }

  sync_tags:
    needs: [request_gate, preflight, update_existing]
    # Supports an explicit tag-only repair and automatically runs after a
    # successful manual SteamCMD update. If the desktop Steam runner is not
    # configured, this job cannot run; NEVER consider upload fully synced.
    if: ${{ always() && needs.preflight.result == 'success' && (needs.request_gate.outputs.mode == 'sync_tags_existing' || (needs.request_gate.outputs.mode == 'update_existing' && needs.update_existing.result == 'success')) }}
    runs-on: [self-hosted, windows, steamworks-tag-publisher]
    environment: steam-workshop-private
    timeout-minutes: 12
    steps:
      - name: Check out approved main (no checkout credentials retained)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Recheck SHA and existing Workshop identity
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ needs.request_gate.outputs.exact_sha }}
        run: |
          if ($env:GITHUB_SHA -cne $env:EXPECTED_SHA) { throw 'Source SHA changed' }
          python Scripts/steamworks_tags.py
          if ($LASTEXITCODE -ne 0) { throw 'Steamworks source check failed' }
      - name: Apply tags through authenticated desktop Steamworks
        shell: pwsh
        env:
          MODE: ${{ needs.request_gate.outputs.mode }}
          CONFIRMATION: ${{ needs.request_gate.outputs.confirmation }}
        run: |
          if ($env:MODE -eq 'sync_tags_existing') {
            if ($env:CONFIRMATION -cne 'TAGS_EXISTING_ONLY') { throw 'Tag approval missing' }
          } elseif ($env:MODE -eq 'update_existing') {
            if ($env:CONFIRMATION -cne 'UPDATE_EXISTING_ONLY') { throw 'Private-upload approval missing' }
          } else {
            throw 'Invalid tag-sync dispatch mode'
          }
          # Host-only vars CCTO_STEAMWORKS_AGENT_BIN and CCTO_STEAM_TAG_RECEIPT.
          # Run the Windows GitHub runner in the INTERACTIVE Steam desktop session.
          if ($env:MODE -eq 'update_existing') {
            python Scripts/steamworks_tags.py --sync --confirm TAGS_EXISTING_ONLY --after-upload-run-id "$env:GITHUB_RUN_ID"
          } else {
            python Scripts/steamworks_tags.py --sync --confirm TAGS_EXISTING_ONLY
          }
          if ($LASTEXITCODE -ne 0) { throw 'Steamworks tag update failed' }
