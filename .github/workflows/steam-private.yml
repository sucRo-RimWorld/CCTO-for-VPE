name: CCTO for VPE SteamCMD private upload
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'preflight / runner_check / upload_private / sync_tags_private'
        required: true
        type: choice
        default: preflight
        options:
          - preflight
          - runner_check
          - upload_private
          - sync_tags_private
      exact_main_sha:
        description: 'Exactly 40 hex chars of the approved current main HEAD'
        type: string
        required: true
      create_new_item:
        description: 'Creation disabled for the existing item; must remain false'
        type: boolean
        default: false
        required: true
      confirmation:
        description: 'PRIVATE_ONLY for upload_private; TAGS_PRIVATE_ONLY for sync_tags_private'
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: ccto-vpe-steam-private-publishing
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify manual default-branch authorization (no untrusted refs)
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.exact_main_sha }}
          REQUESTED_MODE: ${{ inputs.mode }}
          CONFIRMATION: ${{ inputs.confirmation }}
          CREATE_NEW: ${{ inputs.create_new_item }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == 'sucRo-RimWorld/CCTO-for-VPE' ]] || exit 2
          [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' && "$GITHUB_REF" == 'refs/heads/main' ]] || exit 2
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ && "$EXPECTED_SHA" == "$GITHUB_SHA" ]] || exit 2
          if [[ "$REQUESTED_MODE" == 'upload_private' ]]; then
            [[ "$CREATE_NEW" == 'false' && "$CONFIRMATION" == 'PRIVATE_ONLY' ]] || exit 2
            # Creation disabled: update the author-selected existing Workshop item only.
          elif [[ "$REQUESTED_MODE" == 'sync_tags_private' ]]; then
            [[ "$CREATE_NEW" == 'false' && "$CONFIRMATION" == 'TAGS_PRIVATE_ONLY' ]] || exit 2
          elif [[ "$REQUESTED_MODE" == 'preflight' || "$REQUESTED_MODE" == 'runner_check' ]]; then
            [[ "$CREATE_NEW" == 'false' && -z "$CONFIRMATION" ]] || exit 2
          else
            exit 2
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Checkout CCTO main for nine counterpart parity checks
        uses: actions/checkout@v4
        with:
          repository: sucRo-RimWorld/RimWorld-Crop-Cold-Tolerance-Overhaul
          ref: main
          path: .ccto-base
          persist-credentials: false
          sparse-checkout: |
            Patches
      - name: Verify exact-source plant contracts, approved preview and uploader safety
        env:
          CCTO_SOURCE_ROOT: .ccto-base
          CCTO_PARITY_REQUIRED: '1'
        run: python -m unittest discover -s Tests -p 'test_*.py' -v
      - name: Build exactly seven subscriber files
        run: |
          python Scripts/build_release.py --output Dist/CCTO-for-VPE-0.1.0.zip
          python Scripts/steamcmd_private.py --zip Dist/CCTO-for-VPE-0.1.0.zip
          python Scripts/steamworks_tags.py
          # Hash entries are relative to Dist; upload_private verifies after cd Dist.
          (cd Dist && sha256sum CCTO-for-VPE-0.1.0.zip > sha256.txt && sha256sum -c sha256.txt)
      - name: Retain candidate for publisher job and auditing
        uses: actions/upload-artifact@v4
        with:
          name: ccto-for-vpe-0.1.0-private-candidate
          path: |
            Dist/CCTO-for-VPE-0.1.0.zip
            Dist/sha256.txt
          if-no-files-found: error
          retention-days: 7
  runner_check:
    needs: preflight
    if: ${{ inputs.mode == 'runner_check' }}
    # Same dedicated host and GitHub environment as upload_private, but no SteamCMD invocation.
    runs-on: [self-hosted, linux, steamcmd-private-publisher]
    environment: steam-workshop-private
    timeout-minutes: 12
    steps:
      - name: Check out approved main on publisher runner
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download preflight candidate on publisher runner
        uses: actions/download-artifact@v4
        with:
          name: ccto-for-vpe-0.1.0-private-candidate
          path: Dist
      - name: Verify downloaded artifact checksum without invoking SteamCMD
        shell: bash
        run: |
          set -euo pipefail
          cd Dist
          sha256sum -c sha256.txt

  upload_private:
    needs: preflight
    if: ${{ inputs.mode == 'upload_private' }}
    # Dedicated, isolated publisher host. Do NOT attach this label to general PR/test runners.
    runs-on: [self-hosted, linux, steamcmd-private-publisher]
    environment: steam-workshop-private
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ccto-for-vpe-0.1.0-private-candidate
          path: Dist
      - name: Verify candidate artifact digest and reviewed source before invoking SteamCMD
        shell: bash
        run: |
          set -euo pipefail
          cd Dist
          sha256sum -c sha256.txt
      - name: SteamCMD private-only create/update (no credentials in GitHub)
        shell: bash
        env:
          CREATE_NEW: ${{ inputs.create_new_item }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          # CCTO_STEAMCMD_BIN, CCTO_STEAM_ACCOUNT and CCTO_STEAM_STATE
          # must already be configured LOCALLY on the isolated runner.
          [[ "$CREATE_NEW" == 'false' ]] || exit 2
          python3 Scripts/steamcmd_private.py \
            --zip Dist/CCTO-for-VPE-0.1.0.zip \
            --execute --confirm "$CONFIRMATION"

  sync_tags:
    needs: [preflight, upload_private]
    # Supports an explicit tag-only repair and automatically runs after a
    # successful manual SteamCMD update. If the desktop Steam runner is not
    # configured, this job cannot run; NEVER consider upload fully synced.
    if: ${{ always() && needs.preflight.result == 'success' && (inputs.mode == 'sync_tags_private' || (inputs.mode == 'upload_private' && needs.upload_private.result == 'success')) }}
    runs-on: [self-hosted, windows, steamworks-tag-publisher]
    environment: steam-workshop-private
    timeout-minutes: 12
    steps:
      - name: Check out approved main (no checkout credentials retained)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Recheck SHA and existing Workshop identity
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ inputs.exact_main_sha }}
        run: |
          if ($env:GITHUB_SHA -cne $env:EXPECTED_SHA) { throw 'Source SHA changed' }
          python Scripts/steamworks_tags.py
      - name: Apply tags through authenticated desktop Steamworks
        shell: pwsh
        env:
          MODE: ${{ inputs.mode }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if ($env:MODE -eq 'sync_tags_private') {
            if ($env:CONFIRMATION -cne 'TAGS_PRIVATE_ONLY') { throw 'Tag approval missing' }
          } elseif ($env:MODE -eq 'upload_private') {
            if ($env:CONFIRMATION -cne 'PRIVATE_ONLY') { throw 'Private-upload approval missing' }
          } else {
            throw 'Invalid tag-sync dispatch mode'
          }
          # Host-only vars CCTO_STEAMWORKS_AGENT_BIN and CCTO_STEAM_TAG_RECEIPT.
          # Run the Windows GitHub runner in the INTERACTIVE Steam desktop session.
          python Scripts/steamworks_tags.py --sync --confirm TAGS_PRIVATE_ONLY
