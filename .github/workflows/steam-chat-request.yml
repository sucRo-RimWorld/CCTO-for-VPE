name: CCTO for VPE chat-requested Workshop update
on:
  issues:
    types: [opened]
permissions:
  contents: read
  actions: write
jobs:
  request_gate:
    if: >-
      github.event.issue.user.login == 'sucRo0629' &&
      github.event.issue.title == '[publish:ccto-vpe-update]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate author issue identity and exact current main commit
        id: request
        shell: bash
        env:
          REQUEST_TITLE: ${{ github.event.issue.title }}
          REQUEST_BODY: ${{ github.event.issue.body }}
          REQUEST_AUTHOR: ${{ github.event.issue.user.login }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == 'sucRo-RimWorld/CCTO-for-VPE' ]] || exit 2
          [[ "$GITHUB_EVENT_NAME" == 'issues' && "$GITHUB_REF" == 'refs/heads/main' ]] || exit 2
          [[ "$REQUEST_AUTHOR" == 'sucRo0629' && "$REQUEST_TITLE" == '[publish:ccto-vpe-update]' ]] || exit 2
          [[ "$REQUEST_BODY" =~ ^source_sha=([0-9a-f]{40})$ ]] || exit 2
          [[ "${BASH_REMATCH[1]}" == "$GITHUB_SHA" ]] || exit 2
          # Dispatch the owner-approved existing visibility-preserving workflow.
          # This job never contacts Steam or bypasses Environment required reviewers.
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/steam-private.yml/dispatches" \
            -d '{"ref":"main","inputs":{"mode":"update_existing","exact_main_sha":"'${GITHUB_SHA}'","create_new_item":"false","confirmation":"UPDATE_EXISTING_ONLY"}}'
